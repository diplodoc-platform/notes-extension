# Do not edit this file in other packages - it is automatically copied from here.
# To modify this workflow, edit it in diplodoc/devops/infra/scaffolding/.github/workflows/
# and then run the scaffolding update process.

name: Dependency Review

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.9.0
        with:
          # Fail the check for high and critical vulnerabilities.
          # Moderate and low are reported but do not block the PR.
          fail-on-severity: high
          # License checks are enabled; deny strong copyleft licenses
          # incompatible with the permissive MIT-licensed Diplodoc platform.
          license-check: true
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0

  private-eligibility-notice:
    name: Private repository dependency review notice
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred review
        run: >
          echo 'No dependency or license review was performed; deferred until the owner makes the repository public and the strict review is rerun.' >> "$GITHUB_STEP_SUMMARY"
